<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#11110f" />
    <title>News Reader</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Private reader</p>
          <h1>News Reader</h1>
        </div>
        <button id="refresh-button" type="button">Refresh</button>
      </header>

      <section class="source-strip" id="source-strip" aria-label="Sources"></section>

      <section class="feed-page" aria-label="Articles">
        <div class="feed-meta">
          <span id="feed-status">Loading sources...</span>
          <span id="feed-count"></span>
        </div>
        <ol id="article-list" class="article-list"></ol>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
