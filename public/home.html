<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#11110f" />
    <title>News Reader</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell public-reader-page">
      <header class="topbar public-reader-topbar">
        <div>
          <p class="eyebrow">Public reader</p>
          <h1>News Reader</h1>
        </div>
        <a class="admin-link" href="/login?next=%2Findex.html">Login</a>
      </header>

      <article class="reader-panel public-article-panel" aria-live="polite">
        <div class="reader-content">
          <div class="reader-head">
            <p class="eyebrow" id="public-source">Reader</p>
            <h2 id="public-title">Loading current article...</h2>
            <p id="public-meta" class="public-article-meta"></p>
          </div>
          <div id="public-body" class="reader-body public-reader-body">
            <p>Loading the current reader item.</p>
          </div>
          <p class="public-original-link">
            <a id="public-link" href="#" target="_blank" rel="noopener noreferrer">Open original</a>
          </p>
        </div>
      </article>
    </main>

    <script src="/public-home.js"></script>
  </body>
</html>
